<svg width="1200" height="1200" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="30%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#2d0612"/>
      <stop offset="100%" stop-color="#0f0408"/>
    </radialGradient>
    <radialGradient id="g1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b1a3a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8b1a3a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a0a1e" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#4a0a1e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <ellipse cx="300" cy="350" rx="500" ry="420" fill="url(#g1)"/>
  <ellipse cx="950" cy="900" rx="420" ry="380" fill="url(#g2)"/>

  <!-- AUREX wordmark — centered at 600,600 -->
