  <!-- Divider line -->
  <line x1="260" y1="665" x2="940" y2="665" stroke="#8b1a3a" stroke-width="1.2" opacity="0.7"/>

  <!-- Pmarketing subtitle -->
  <text
    x="938" y="704"
    text-anchor="end"
    font-family="'Syne', system-ui, sans-serif"
    font-weight="500"
    font-size="24"
    letter-spacing="5"
